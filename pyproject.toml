[project]
name = "zeratool-lib"
version = "0.1.0"
description = "Fork of Zeratool for exploiting executables on the local machine"
authors = [{ name = "George-Andrei Iosif", email = "hi@iosifache.me" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "GPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "angr>=9.2.52,<10",
    "claripy>=9.2.52,<10",
    "ipython>=8.13.2,<9",
    "pwntools>=4.10.0,<5",
    "r2pipe>=1.8.0,<2",
    "timeout-decorator>=0.5.0,<0.6",
    "tqdm>=4.65.0,<5",
    "pydemumble==0.0.1",
]

[dependency-groups]
dev = ["pytest>=7.3.1,<8"]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["zeratool_lib"]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
